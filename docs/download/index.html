<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download T3 Neo</title>
    <meta name="robots" content="noindex" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #110f0d;
        --card: #171412;
        --border: rgb(255 237 217 / 10%);
        --ink: #ffedd9;
        --muted: #a4958a;
        --accent: #f2a26e;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg)
          radial-gradient(60rem 30rem at 50% -10rem, rgb(242 162 110 / 8%), transparent 70%);
        color: var(--ink);
        font-family:
          "Schibsted Grotesk", "Inter Tight", Inter, "Helvetica Neue", Helvetica, Arial, system-ui,
          sans-serif;
        letter-spacing: -0.005em;
      }
      main {
        width: min(92vw, 520px);
        padding: 32px;
        border: 1px solid var(--border);
        border-radius: 20px;
        background: var(--card);
        box-shadow: 0 30px 60px -40px rgb(0 0 0 / 80%);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        font-weight: 300;
        letter-spacing: -0.03em;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        line-height: 1.5;
      }
      .button {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        border-radius: 999px;
        border: 1px solid transparent;
        background: var(--accent);
        color: #1b120a;
        font-weight: 600;
        text-decoration: none;
      }
      .button.secondary {
        background: transparent;
        border-color: var(--border);
        color: var(--ink);
      }
      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .label {
        margin-top: 18px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      ul {
        margin: 8px 0 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 6px;
      }
      li a {
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid var(--border);
      }
      code {
        font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Download T3 Neo</h1>
      <p id="status">Looking up the latest release for your system…</p>
      <div class="row">
        <a class="button" id="primary" href="../../releases/latest" rel="noopener">Download</a>
        <a class="button secondary" id="all" href="../../releases/latest" rel="noopener"
          >All releases</a
        >
      </div>
      <div class="label">Other platforms</div>
      <ul id="others"></ul>
      <p style="margin-top: 20px"><code id="meta"></code></p>
    </main>
    <script>
      // Self-contained: this page is served from the repository's GitHub Pages,
      // so the repository slug comes from the page's own URL
      // (https://OWNER.github.io/REPO/download/). A "repo" query overrides it.
      (async () => {
        const params = new URLSearchParams(location.search);
        const host = location.hostname;
        const pathRepo = location.pathname.split("/").filter(Boolean)[0];
        const owner = host.endsWith(".github.io") ? host.slice(0, -".github.io".length) : null;
        const repo =
          params.get("repo") ?? (owner && pathRepo ? `${owner}/${pathRepo}` : "xibn/t3neo");
        const releasesUrl = `https://github.com/${repo}/releases`;
        const status = document.getElementById("status");
        const primary = document.getElementById("primary");
        const all = document.getElementById("all");
        const others = document.getElementById("others");
        const meta = document.getElementById("meta");
        all.href = `${releasesUrl}/latest`;
        primary.href = `${releasesUrl}/latest`;

        const ua = navigator.userAgent.toLowerCase();
        const platform = (navigator.platform || "").toLowerCase();
        const detected =
          platform.startsWith("win") || ua.includes("windows")
            ? "windows"
            : platform.startsWith("linux") || ua.includes("linux")
              ? "linux"
              : platform.startsWith("mac") || ua.includes("mac os")
                ? "mac-arm64"
                : "unknown";
        const labels = {
          "mac-arm64": "macOS (Apple silicon)",
          "mac-x64": "macOS (Intel)",
          linux: "Linux (AppImage)",
          windows: "Windows",
        };
        const matchers = {
          "mac-arm64": (n) => n.endsWith(".dmg") && n.includes("arm64"),
          "mac-x64": (n) => n.endsWith(".dmg") && n.includes("x64"),
          linux: (n) => n.endsWith(".appimage"),
          windows: (n) => n.endsWith(".exe"),
        };

        try {
          const response = await fetch(`https://api.github.com/repos/${repo}/releases/latest`, {
            headers: { Accept: "application/vnd.github+json" },
          });
          if (!response.ok) throw new Error(`GitHub responded with ${response.status}`);
          const release = await response.json();
          const assets = Array.isArray(release.assets) ? release.assets : [];
          const pick = (key) =>
            assets.find((asset) => matchers[key](String(asset.name).toLowerCase())) ?? null;
          const mine = detected === "unknown" ? null : pick(detected);
          if (mine) {
            primary.href = mine.browser_download_url;
            primary.textContent = `Download for ${labels[detected]}`;
            status.textContent = `T3 Neo ${release.tag_name}, built for ${labels[detected]}.`;
          } else {
            primary.textContent = "Open the latest release";
            status.textContent = `T3 Neo ${release.tag_name}. Pick your platform below.`;
          }
          for (const key of Object.keys(labels)) {
            if (key === detected && mine) continue;
            const asset = pick(key);
            if (!asset) continue;
            const item = document.createElement("li");
            const link = document.createElement("a");
            link.href = asset.browser_download_url;
            link.textContent = `${labels[key]} · ${asset.name}`;
            item.appendChild(link);
            others.appendChild(item);
          }
          meta.textContent = `${repo} · published ${new Date(release.published_at).toLocaleDateString()}`;
          if (mine && params.get("auto") === "1") location.href = mine.browser_download_url;
        } catch (error) {
          status.textContent = `Could not read the latest release (${error.message}). Opening the releases page works too.`;
          primary.textContent = "Open releases";
        }
      })();
    </script>
  </body>
</html>
